name: Installer deployment diagnostics
on: workflow_dispatch
permissions:
  contents: read
jobs:
  deployment:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download published installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download v0.8.2 --repo $env:GITHUB_REPOSITORY --pattern B5MShot-Setup.exe --dir release/installer-probe
      - name: Test actual package deployment with Windows PowerShell 5.1
        shell: powershell
        run: ./tests/installer-deployment.ps1
