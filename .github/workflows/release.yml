name: Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Protect already published release assets
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $draft=gh release view $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --json isDraft --jq '.isDraft' 2>$null
          if($LASTEXITCODE -eq 0 -and $draft -eq 'false'){throw 'Release is already published; verified assets must never be overwritten.'}
          $global:LASTEXITCODE=0
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Import signing identity
        shell: pwsh
        env:
          SIGNING_PFX: ${{ secrets.B5MSHOT_SIGNING_PFX }}
          SIGNING_PASSWORD: ${{ secrets.B5MSHOT_SIGNING_PASSWORD }}
        run: |
          $path=Join-Path $env:RUNNER_TEMP 'b5mshot-signing.pfx'
          [IO.File]::WriteAllBytes($path,[Convert]::FromBase64String($env:SIGNING_PFX))
          $cert=Import-PfxCertificate -FilePath $path -CertStoreLocation Cert:/CurrentUser/My -Password (ConvertTo-SecureString $env:SIGNING_PASSWORD -AsPlainText -Force)
          "SIGNING_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV
          Remove-Item -LiteralPath $path
      - name: Build app, Explorer extension and signed installer
        shell: pwsh
        run: ./packaging/build-release.ps1 -CertificateThumbprint $env:SIGNING_THUMBPRINT
      - name: Verify autostart migration without touching real startup entries
        shell: pwsh
        run: |
          ./tests/autostart-migration.ps1
          dotnet run --project tests/B5MShot.Smoke -c Release -- --autostart
          if($LASTEXITCODE -ne 0){throw 'Autostart smoke checks failed'}
      - uses: actions/upload-artifact@v4
        with:
          name: B5MShot-0.8.2
          path: |
            release/stable-0.8.2/B5MShot.exe
            release/stable-0.8.2/B5MShot-Setup.exe
            release/stable-0.8.2/SHA256SUMS.txt
      - name: Create draft release for verification
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          body_path: docs/release-0.8.2.md
          files: |
            release/stable-0.8.2/B5MShot.exe
            release/stable-0.8.2/B5MShot-Setup.exe
            release/stable-0.8.2/SHA256SUMS.txt
