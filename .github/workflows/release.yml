name: Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Protect already published release assets
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $draft=gh release view $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --json isDraft --jq '.isDraft' 2>$null
          if($LASTEXITCODE -eq 0 -and $draft -eq 'false'){throw 'Release is already published; verified assets must never be overwritten.'}
          $global:LASTEXITCODE=0
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Import signing identity
        shell: pwsh
        env:
          SIGNING_PFX: ${{ secrets.B5MSHOT_SIGNING_PFX }}
          SIGNING_PASSWORD: ${{ secrets.B5MSHOT_SIGNING_PASSWORD }}
        run: |
          $path=Join-Path $env:RUNNER_TEMP 'b5mshot-signing.pfx'
          [IO.File]::WriteAllBytes($path,[Convert]::FromBase64String($env:SIGNING_PFX))
          $cert=Import-PfxCertificate -FilePath $path -CertStoreLocation Cert:/CurrentUser/My -Password (ConvertTo-SecureString $env:SIGNING_PASSWORD -AsPlainText -Force)
          "SIGNING_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV
          Remove-Item -LiteralPath $path
      - name: Build app, Explorer extension and signed installer
        shell: pwsh
        run: ./packaging/build-release.ps1 -CertificateThumbprint $env:SIGNING_THUMBPRINT
      - name: Verify autostart migration without touching real startup entries
        shell: pwsh
        run: |
          ./tests/autostart-migration.ps1
          dotnet run --project tests/B5MShot.Smoke -c Release -- --autostart
          if($LASTEXITCODE -ne 0){throw 'Autostart smoke checks failed'}
      - name: Verify installation failure states in Windows PowerShell 5.1
        shell: powershell
        run: ./tests/installer-workflow.ps1
      - name: Build isolated update handoff fixture
        shell: pwsh
        run: dotnet publish tests/HandoffFixture -c Release -r win-x64 --self-contained true
      - name: Verify real process handoff and editor protection
        shell: powershell
        run: ./tests/update-handoff.ps1
      - name: Execute actual native installer on clean hosted runner
        shell: pwsh
        run: ./tests/installer-native-smoke.ps1
      - name: Verify upgrade from running old release and startup takeover
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.8.3 --repo $env:GITHUB_REPOSITORY --pattern 'B5MShot*.exe' --dir release/previous
          if($LASTEXITCODE -ne 0){throw 'Cannot download upgrade baseline'}
          ./tests/installer-upgrade.ps1
      - name: Preserve installer diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-diagnostics
          path: ~/AppData/Local/B5MShot/logs/setup-*
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: B5MShot-0.8.4
          path: |
            release/stable-0.8.4/B5MShot.exe
            release/stable-0.8.4/B5MShot-Setup.exe
            release/stable-0.8.4/SHA256SUMS.txt
      - name: Create draft release for verification
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          body_path: docs/release-0.8.4.md
          files: |
            release/stable-0.8.4/B5MShot.exe
            release/stable-0.8.4/B5MShot-Setup.exe
            release/stable-0.8.4/SHA256SUMS.txt
